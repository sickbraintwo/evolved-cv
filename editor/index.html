<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvolvedCV — Local Editor</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <!-- Pickr: minimal vanilla color picker (no framework). Fallback to the
       native <input type=color> if the CDN is unavailable. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">EvolvedCV <span>· Local editor</span></div>
    <div class="topbar__actions">
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      <label class="autosave-ctl" title="Auto-saves to disk on every change (0.7s debounce). Disable to save only via the Save button.">
        <input type="checkbox" id="autosave-toggle" checked /> Auto-save
      </label>
      <button id="btn-save" class="btn btn--primary" type="button" disabled>Save</button>
    </div>
  </header>

  <main class="layout">
    <!-- LEFT: editor panel -->
    <section class="panel" aria-label="Editor">
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab is-active" data-tab="profile" role="tab">Profile</button>
        <button class="tab" data-tab="pages" role="tab">Pages</button>
        <button class="tab" data-tab="intro" role="tab">Animation</button>
        <button class="tab" data-tab="particles" role="tab">Particles</button>
        <button class="tab" data-tab="expertise" role="tab">Skills</button>
        <button class="tab" data-tab="about" role="tab">About</button>
        <button class="tab" data-tab="experience" role="tab">Experience</button>
        <button class="tab" data-tab="education" role="tab">Education</button>
        <button class="tab" data-tab="colors" role="tab">UI</button>
        <button class="tab" data-tab="pdf" role="tab">PDF</button>
      </nav>
      <div class="tabpanes" id="tabpanes">
        <div class="pane is-active" data-pane="profile"></div>
        <div class="pane" data-pane="pages"></div>
        <div class="pane" data-pane="intro"></div>
        <div class="pane" data-pane="particles"></div>
        <div class="pane" data-pane="expertise"></div>
        <div class="pane" data-pane="about"></div>
        <div class="pane" data-pane="experience"></div>
        <div class="pane" data-pane="education"></div>
        <div class="pane" data-pane="colors"></div>
        <div class="pane" data-pane="pdf"></div>
      </div>
    </section>

    <!-- divider -->
    <div class="divider" aria-hidden="true"></div>

    <!-- RIGHT: live preview -->
    <section class="preview" aria-label="Preview">
      <div class="preview__toolbar">
        <div class="dev-group" role="group" aria-label="Desktop preview">
          <button class="seg__btn is-active" id="prev-desktop" type="button">Desktop</button>
          <select class="fmt-select" id="fmt-desktop" title="Desktop format" aria-label="Desktop format">
            <option value="16:9">16:9</option>
            <option value="16:10">16:10</option>
            <option value="3:2">3:2</option>
            <option value="4:3">4:3</option>
            <option value="5:4">5:4</option>
            <option value="21:9">21:9</option>
            <option value="free" selected>Free</option>
          </select>
        </div>
        <div class="dev-group" role="group" aria-label="Mobile preview">
          <button class="seg__btn" id="prev-mobile" type="button">Mobile</button>
          <select class="fmt-select" id="fmt-mobile" title="Mobile format" aria-label="Mobile format">
            <option value="9:16" selected>9:16</option>
            <option value="9:18">9:18</option>
            <option value="9:19.5">9:19.5</option>
            <option value="9:20">9:20</option>
            <option value="3:4">3:4</option>
            <option value="2:3">2:3</option>
            <option value="free">Free</option>
          </select>
        </div>
        <label class="width-ctl" title="Resolution (width)">
          <input type="range" id="prev-width" min="360" max="1920" step="10" value="1280" />
          <span id="prev-width-label" class="width-label">1280px</span>
        </label>
        <button class="btn" id="prev-glass-mode" type="button">Glass: WebGL</button>
        <button class="btn" id="prev-reload" type="button" title="Reload preview">↻ Reload</button>
      </div>
      <div class="preview__stage">
        <div class="preview__frame-wrap" id="frame-wrap">
          <iframe id="preview-frame" title="Site preview" src="/?preview=1"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="editor.js"></script>
</body>
</html>
