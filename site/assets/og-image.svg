<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7B2FFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#7B2FFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#00D4FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- particle hints (domain colors) -->
  <g>
    <circle cx="980" cy="120" r="5" fill="#00D4FF" opacity="0.9"/>
    <circle cx="1060" cy="210" r="3" fill="#7B2FFF" opacity="0.8"/>
    <circle cx="900" cy="300" r="4" fill="#FF4FA0" opacity="0.7"/>
    <circle cx="1100" cy="380" r="3" fill="#3DFFA8" opacity="0.8"/>
    <circle cx="1010" cy="470" r="5" fill="#00D4FF" opacity="0.5"/>
    <circle cx="870" cy="180" r="2.5" fill="#3DFFA8" opacity="0.6"/>
    <circle cx="1130" cy="90" r="2.5" fill="#FF4FA0" opacity="0.6"/>
    <circle cx="940" cy="540" r="3" fill="#7B2FFF" opacity="0.6"/>
    <line x1="980" y1="120" x2="1060" y2="210" stroke="#00D4FF" stroke-opacity="0.25"/>
    <line x1="1060" y1="210" x2="900" y2="300" stroke="#7B2FFF" stroke-opacity="0.2"/>
    <line x1="900" y1="300" x2="1100" y2="380" stroke="#FF4FA0" stroke-opacity="0.2"/>
    <line x1="1100" y1="380" x2="1010" y2="470" stroke="#3DFFA8" stroke-opacity="0.25"/>
  </g>

  <!-- diamond mark (matches the filter FAB icon) -->
  <g transform="translate(96 96) rotate(45 28 28)">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="url(#brand)" stroke-width="6"/>
  </g>

  <text x="96" y="300" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="44" font-weight="700" fill="url(#brand)">EvolvedCV</text>
  <text x="96" y="382" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="64" font-weight="700" fill="#E8E8F0">Christina Debug</text>
  <text x="96" y="438" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="30" fill="#A0A0B4">Computational Biologist &amp; Digital Health Researcher</text>
  <text x="96" y="510" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="24" fill="#7A7A90">An interactive, filterable CV — pick the skills, watch it reshape itself.</text>

  <rect x="96" y="548" width="160" height="4" rx="2" fill="url(#brand)"/>
</svg>
